# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Traffic path: internet -> caddy (80/443, automatic HTTPS) -> frontend / backend.
# Only caddy is published; mongo, backend and frontend are reachable on the
# internal Docker network only.
#
# Before running:
#   1. Point the domain's A record at this server, and open ports 80 and 443.
#   2. Root .env:  DOMAIN=<your domain>
#                  REACT_APP_BACKEND_URL=https://<your domain>
#                  BACKEND_URL=https://<your domain>
#   3. backend/.env:  CORS_ORIGINS, FRONTEND_URL, BACKEND_URL = https://<your domain>
#   4. If using MongoDB Atlas, set MONGO_URL in backend/.env and remove the mongo service override below

services:
  mongo:
    # Do NOT expose MongoDB port publicly in production.
    # `!reset` is required: a plain `ports: []` is merged with the base file and keeps its mapping.
    ports: !reset []

  backend:
    restart: always
    ports: !reset []

  frontend:
    restart: always
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: shemford_caddy
    restart: always
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the root .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates — keep this volume or they are re-issued
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
